general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/wallhaven-qd9odd.jpg
    blur_passes = 3
    blur_size = 3
}

input-field {

    monitor =
    size = 250, 50
    outline_thickness = 2
    outer_color = rgb(255, 255, 255)
    inner_color = rgba(0, 0, 0, 0.75)
    font_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text = Password...

    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(255, 255, 255)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%A, %d %B')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:100] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap')"
    color = rgb(255, 255, 255)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -170
    halign = center
    valign = center
}
