monitor=,1920x1080@60,auto,1

$terminal = kitty
$menu = wofi --show drun

exec-once = waybar

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER, M, exit

input {
	kb_layout = us,dk
	kb_options = grp:win)_space_toggle
}

general { 
	gaps_in = 5 
	gaps_out = 10 
	border_size = 2
}

decoration {
	rounding = 8
}

misc { 
	disable_hyprland_logo = true
}
