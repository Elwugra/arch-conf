monitor=,1920x1080@60,auto,1

$terminal = kitty
$menu = wofi --show drun

exec-once = waybar
exec-once = ~/.config/hypr/wallpaper.sh
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = swayosd-server
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, D, exec, $menu
bind = SUPER, Q, killactive
bind = SUPER, M, exit
bind = SUPER, E, exec, thunar
bind = , PRINT, exec, ~/.config/hypr/screenshot.sh
bind = SUPER SHIFT, S, exec, ~/.config/hypr/screenshot.sh area
bind = SUPER, V, exec, ~/.config/hypr/clipboard.sh
bind = SUPER SHIFT, L, exec, hyprlock
bind = SUPER, P, exec, ~/.config/hypr/power-menu.sh
bind = SUPER, W, exec, chromium
bind = SUPER, N, exec, ~/.config/hypr/network-menu.sh
bind = SUPER, B, exec, kitty -e btop
bind = SUPER SHIFT, R, exec, ~/.config/hypr/screenrecord.sh
bind = SUPER SHIFT, A, exec, ~/.config/hypr/screenrecord.sh area

# -------- Volume --------
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/volume.sh +5
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/volume.sh -5
bindl  = , XF86AudioMute, exec, ~/.config/hypr/mute.sh
# -------- Media --------
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# -------- Brightness --------
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

env = XCURSOR_THEME,Vimix-white-cursors
env = XCURSORS_SIZE,24

input {
	kb_layout = us,dk,ru,ua
	kb_options = grp:win_space_toggle
}

general { 
	gaps_in = 5 
	gaps_out = 10 
	border_size = 2
}

decoration {
	rounding = 8

	active_opacity = 1.0
	inactive_opacity = 0.92
}

misc { 
	disable_hyprland_logo = true
}

# Anim

animations {
    enabled = true

    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = windows, 1, 4, easeOut
    animation = windowsOut, 1, 4, easeOut
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut
}

# Workspaces 

$mainMod = SUPER

bind = $mainMod, 1, workspace, 1  
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Focus on window / move window

bind = $mainMod, left, movefocus, l 
bind = $mainMod, right, movefocus, r 
bind = $mainMod, up, movefocus, u 
bind = $mainMod, down, movefocus, d 

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, SPACE, togglefloating

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
